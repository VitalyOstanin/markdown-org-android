org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The version being worked towards, and the heading CHANGELOG.md collects the
# changes under. Raised by hand when a release is cut; the version code and
# the commit are supplied by whoever builds (see app/build.gradle.kts).
appVersionName=0.1.0

# What a build gets when nobody passes -PappVersionCode; CI passes the run
# number and overrides this. Android refuses to install a lower code over a
# higher one, and refuses it even with the downgrade flag once the app is not
# debuggable -- so the 1 this used to fall back to made every local build
# unable to land on a phone carrying a published release. Kept level with the
# latest release instead: an equal code installs either way round, so a build
# from the tree and one from CI each go over the other. Raise it when the
# published code passes it.
appVersionCode=74
