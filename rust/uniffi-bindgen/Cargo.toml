[package]
name = "uniffi-bindgen"
version = "0.1.0"
description = "Binding generator entry point, per the UniFFI multi-crate workspace layout"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
