[workspace]
resolver = "2"
members = ["markdown-org-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
# The oldest toolchain that compiles the workspace with the locked
# dependencies, and it is checked: the workflow reads this line and builds on
# whatever it says. The bound comes from the dependencies rather than from the
# sources here — cargo-platform 0.3.3 asks for 1.91, several others for 1.86
# to 1.88 — so it moves when the lock file does, and the check is what makes
# that visible. It said 1.85 until a run proved otherwise.
rust-version = "1.91"
authors = ["Vitaly Ostanin <vitaly.ostanin@gmail.com>"]
license = "MIT"
repository = "https://github.com/VitalyOstanin/markdown-org-android"

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
# "debuginfo", not "symbols": UniFFI stores the interface metadata in the
# library's symbols, and stripping those leaves the generator with
# "No UniFFI metadata found". Debug info is the bulk of the size anyway.
strip = "debuginfo"
# No panic = "abort": UniFFI turns a panic crossing the boundary into a
# foreign exception, which requires unwinding. Aborting would take the whole
# application process down instead.
