[package]
name = "markdown-org-ffi"
version = "0.1.0"
description = "UniFFI bindings over markdown-org-extract for the Android application"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what the app loads; lib keeps the crate usable from Rust tests.
# The resulting file is libmarkdown_org_ffi.so — UniFFI requires the "lib"
# prefix, and the name must not be "android" (libandroid.so is a system
# library). Add "staticlib" here if an iOS target is ever added.
crate-type = ["cdylib", "lib"]
name = "markdown_org_ffi"

[dependencies]
uniffi = { workspace = true }
thiserror = "2"
# Vendored on purpose. libgit2 is not installed on an Android device, and
# `vendored-openssl` builds the TLS stack into the library rather than looking
# for a system one that is not there either. Beware LIBGIT2_NO_VENDOR in the
# environment: it overrides the feature and sends the build looking for a
# system libgit2.
git2 = { version = "0.21", default-features = false, features = [
    "https",
    "ssh",
    "vendored-libgit2",
    "vendored-openssl",
] }
# For GIT_OPT_ADD_SSL_X509_CERT, which git2 0.21 does not wrap, and for
# parsing the CA bundle it takes. The certificates cannot be loaded from a
# file on Android — see use_ca_bundle in src/sync.rs. Both crates resolve to
# the same builds git2 already pulls in, so nothing extra is compiled.
libgit2-sys = "0.18"
openssl = "0.10"
# The trait that hands out the raw X509 pointer libgit2 wants; openssl builds
# its types on it and does not re-export it.
foreign-types = "0.3"
# The library API used here (scan_directory, filter_agenda, parse_heading_line,
# refine_entry) is taken from a released version rather than a git revision:
# advisories are checked against it, and the VS Code extension pins the same
# number, so the three clients read one set of notes the same way. The floor is
# 0.20 because that release is the first to parse a phrase in natural language
# into the fields of an entry, which the creation screen calls. 0.19 is the
# first to read the exception keys of a repeating series
# (EXDATE, SERIES_ID, RECURRENCE_ID) in every form they are written in. Anything
# below 0.18 does not read them at all: it draws the occurrence that was
# cancelled, and draws the one that moved twice -- on the day it left and again
# beside the entry standing in for it. 0.18 reads them, but not as a calendar
# export writes them: an EXDATE carrying a time (the form RFC 5545 uses for a
# timed series) it cannot read at all, so the cancelled occurrence comes back,
# and a RECURRENCE_ID written with seconds loses the time it names. A phone
# disagreeing with the editor over which days a series has is the difference
# this pin exists to prevent.
markdown-org-extract = "0.22"
# Dates cross the boundary as strings, but the repeater maths the extractor
# exposes speaks NaiveDate. The same lower bound the extractor states, rather
# than a bare "0.4": otherwise the floor here would be whatever the extractor
# happens to pull in, and it would move without this manifest saying so.
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
# An edit writes beside the note and renames over it, so an interrupted write
# leaves the file alone; this is the temporary half of that.
tempfile = "3"
# Deciding whether the address libgit2 asks about is the configured one means
# comparing host names, and a host name is not a run of ASCII: `MÜNCHEN.example`,
# `münchen.example` and the punycode a client puts on the wire are one server.
# The crate already builds as part of the tree, so naming it here adds no code.
idna = "1"

[dev-dependencies]
# The invariants this crate states in prose -- a file comes back byte for
# byte, an edit touches only the lines it names -- hold over every file a
# reader may hand it, and examples cover the shapes somebody thought of.
# Properties cover the combinations nobody did: a byte-order mark on a file
# whose lines end both ways and whose last line ends with nothing.
proptest = "1.11"

# Which OpenSSL the vendored build compiles. Nothing here calls into this
# crate — `openssl-sys` builds the TLS stack with it, which is why the entry
# stands among the build dependencies and not the ordinary ones. The
# requirement `openssl-sys` states covers the whole 300.x range, and by now
# that means the 3.6 line: no fixes after 2026-11-01, in a TLS stack that
# ships inside the APK and reaches a phone only through a release of this
# project. 3.5 is the long-term line and is supported until 2030-04-08.
#
# `~300.5`, not `300.5`: the caret requirement a bare version stands for
# admits 300.6 as well, and would hold nothing.
[build-dependencies]
openssl-src = "~300.5"
