[package]
name = "markdown-org-ffi"
version = "0.1.0"
description = "UniFFI bindings over markdown-org-extract for the Android application"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what the app loads; lib keeps the crate usable from Rust tests.
# The resulting file is libmarkdown_org_ffi.so — UniFFI requires the "lib"
# prefix, and the name must not be "android" (libandroid.so is a system
# library). Add "staticlib" here if an iOS target is ever added.
crate-type = ["cdylib", "lib"]
name = "markdown_org_ffi"

[dependencies]
uniffi = { workspace = true }
thiserror = "2"
# Vendored on purpose. libgit2 is not installed on an Android device, and
# `vendored-openssl` builds the TLS stack into the library rather than looking
# for a system one that is not there either. Beware LIBGIT2_NO_VENDOR in the
# environment: it overrides the feature and sends the build looking for a
# system libgit2.
git2 = { version = "0.21", default-features = false, features = [
    "https",
    "vendored-libgit2",
    "vendored-openssl",
] }
# For GIT_OPT_ADD_SSL_X509_CERT, which git2 0.21 does not wrap, and for
# parsing the CA bundle it takes. The certificates cannot be loaded from a
# file on Android — see use_ca_bundle in src/sync.rs. Both crates resolve to
# the same builds git2 already pulls in, so nothing extra is compiled.
libgit2-sys = "0.18"
openssl = "0.10"
# The trait that hands out the raw X509 pointer libgit2 wants; openssl builds
# its types on it and does not re-export it.
foreign-types = "0.3"
# Pinned to a commit rather than a crates.io release: the library API used
# here landed after 0.11.1 and has not been published yet. Switch to a
# version requirement once the release carrying src/lib.rs is out.
markdown-org-extract = { git = "https://github.com/VitalyOstanin/markdown-org-extract", rev = "86d395e17b697ddb82bd42e86ae39c0483873b9c" }
# Dates cross the boundary as strings, but the repeater maths the extractor
# exposes speaks NaiveDate. Same version the extractor resolves to.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# An edit writes beside the note and renames over it, so an interrupted write
# leaves the file alone; this is the temporary half of that.
tempfile = "3"
