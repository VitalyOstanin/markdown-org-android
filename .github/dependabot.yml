version: 2

# What has to be watched and why: the TLS stack is compiled into the
# application. libgit2 and OpenSSL are vendored by `git2`, so an advisory
# against either reaches users through a release of this project and through
# nothing else — neither a system update nor an Android one touches them.
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    ignore:
      # The trait this crate hands out has to be the one openssl implements
      # for X509, and openssl 0.10 is still on 0.3. Ahead of it, the core
      # takes ForeignType from one version while the certificate implements
      # the other, as_ptr is no longer found on it, and nothing compiles.
      # This moves when openssl moves; the 0.3 patches still come through.
      - dependency-name: "foreign-types"
        versions: [">= 0.4"]
      # Which OpenSSL the vendored build compiles, and the choice is the
      # release line rather than the newest one. The lines end on very
      # different dates: 3.5 is long-term and is supported until 2030-04-08,
      # while 3.6 runs out on 2026-11-01 and 4.0 on 2027-05-14. A stack that
      # reaches a phone only through a release of this project should sit on
      # the line that keeps receiving fixes the longest, so the bound is where
      # 3.5 ends rather than where 4.0 begins: the 300.5.x patches still come
      # through, and 300.6 and above stay out.
      - dependency-name: "openssl-src"
        versions: [">= 300.6"]
    groups:
      # One pull request for the patch bumps, which are the bulk of them; a
      # major version is worth its own review.
      rust-patches:
        update-types: ["patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The base images of the build containers, pinned by digest: without this
  # the pin is what stops them from ever being updated.
  - package-ecosystem: "docker"
    directories:
      - "/tools"
    schedule:
      interval: "weekly"
