name: Build

# One APK per run, carrying both ABIs the core is built for. A push to master
# publishes it as a prerelease so that the current build is always one link
# away from a phone; a v-tag publishes a release under that tag. A pull
# request builds and tests without touching the signing key or the releases.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish the APK under
        required: false
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A second push to the same branch makes the build in flight pointless. Tags
# are excluded: their runs publish, and cancelling one would leave a tag with
# no assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The core is plain Rust: its tests, its lints and its formatting are
  # checked for the host, without an NDK. Kept apart from the APK build so
  # that a lint failure is visible in a minute rather than after the Android
  # toolchain has been installed.
  check:
    runs-on: ubuntu-24.04
    # A few minutes, most of it the coverage run: it builds the workspace a
    # second time, instrumented, on top of the vendored libgit2 and OpenSSL.
    # The default is six hours, which is what a hung test would hold the
    # runner for — libtest has no per-test timeout of its own.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        # The version rust/rust-toolchain.toml names, rather than stable:
        # rustup obeys that file for every cargo command below, so asking for
        # stable installs one toolchain and then uses another the moment they
        # differ. Read out of the file for the same reason the MSRV step
        # reads the manifest — two places would disagree.
        #
        # llvm-tools carries the reader coverage is computed with, and it has
        # to come from the same release as the compiler that writes the
        # profiles.
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal \
            --component clippy,rustfmt,llvm-tools-preview

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust

      - name: Check the formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: rust
        # --locked here and in tools/build-core.sh: Cargo re-resolves the lock
        # file without saying so when a manifest and the lock disagree, and
        # what is tested — or published — then differs from what the
        # repository records.
        run: cargo test --locked

      - name: Compile with the oldest Rust the manifest promises
        working-directory: rust
        # `rust-version` is a promise to whoever builds the core, and every
        # other job here compiles with a toolchain years ahead of it — so
        # nothing would notice the promise going stale. Read out of the
        # manifest rather than written down again: two places would disagree.
        #
        # check, not build: this asks whether the sources and the locked
        # dependencies still compile on that version, and linking the vendored
        # OpenSSL a second time would cost more than the rest of the job.
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --all-targets

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Install the licence collector
        # The published binary, checked against the digest in versions.env —
        # the same one the build image installs, so CI and a laptop collect
        # the notices with the same tool.
        run: |
          url="https://github.com/EmbarkStudios/cargo-about/releases/download"
          archive="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/about.tar.gz "${url}/${CARGO_ABOUT_VERSION}/${archive}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  /tmp/about.tar.gz" | sha256sum -c -
          tar -xzf /tmp/about.tar.gz -C /tmp
          install -m 0755 "/tmp/${archive}/cargo-about" "$HOME/.cargo/bin/cargo-about"

      - name: Check the notices
        # NOTICE and the list the application shows are committed, and the
        # crate graph behind them moves with every dependency bump. A build
        # that publishes an APK whose notices name the wrong versions is the
        # failure this catches.
        run: NATIVE=1 tools/licenses.sh --check

      - name: Install the coverage runner
        # The published binary, checked against the digest in versions.env —
        # the same one the build image installs, so a report from CI and a
        # report from a laptop are produced by one tool. The archive holds
        # the executable alone.
        run: |
          url="https://github.com/taiki-e/cargo-llvm-cov/releases/download"
          archive="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o /tmp/llvm-cov.tar.gz "${url}/v${CARGO_LLVM_COV_VERSION}/${archive}"
          echo "${CARGO_LLVM_COV_SHA256}  /tmp/llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llvm-cov.tar.gz -C "$HOME/.cargo/bin" cargo-llvm-cov

      - name: Measure what the tests reach
        working-directory: rust
        # Nothing fails on the number yet: this records where the core stands
        # so that a fall becomes visible, which is what the report asked for
        # before a threshold is set. The summary goes to the run's page; the
        # lcov file is what a reader loads into an editor.
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        # Storage is a monthly allowance of gigabyte-hours, and an
        # exhausted one refuses uploads until the month turns. A report
        # that cannot be kept is a report read from the step log instead
        # — it is not a reason to call a passing check failed.
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-core
          path: rust/lcov.info
          if-no-files-found: ignore
          retention-days: 3

  build:
    runs-on: ubuntu-24.04
    # Around four minutes warm, more on a cold cache: the vendored libgit2
    # and OpenSSL are built for both ABIs.
    timeout-minutes: 45

    # No write permission of any kind: this job builds the sources under
    # review, which means running Gradle plugins and every crate's build.rs.
    # Publishing is the job below, which builds nothing.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        # The same file the build images and Gradle read, so this job installs
        # what a local build uses instead of a copy that drifts from it. Only
        # the assignments: comments and blank lines are not valid there.
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Install the NDK
        # The same release tools/Containerfile.ndk unpacks, spelled the way
        # the SDK manager names it: two installations of one NDK, so a build
        # that passed locally does not meet a different compiler here.
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install the Rust Android targets
        # Against the toolchain rust/rust-toolchain.toml names, and named
        # explicitly in the second command: `rustup target add` run from the
        # root of the checkout, where that file does not apply, would add the
        # targets to whatever is default and leave the toolchain that
        # actually compiles the core without them.
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
          rustup target add --toolchain "$version" aarch64-linux-android x86_64-linux-android

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0

      - name: Install cargo-ndk
        # A prebuilt binary rather than `cargo install`: building it here costs
        # a couple of minutes on every cache miss and produces the same tool.
        #
        # The version comes from tools/versions.env, like every other tool
        # here: this job decrypts the signing key a few steps further down,
        # and "whatever was published last" is not something to run beside it.
        #
        # The token is the run's own, and it is here because binstall asks
        # api.github.com where the release lives: unauthenticated, that
        # question shares a per-runner rate limit with everything else on the
        # machine and comes back 403, which fails the build for no reason of
        # ours.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm "cargo-ndk@${CARGO_NDK_VERSION}"

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust
          # The vendored libgit2 and OpenSSL are the bulk of the build and do
          # not change with the sources; a per-ABI key keeps both of them.
          key: ndk-${{ env.NDK_VERSION }}

      - name: Build the core and the bindings
        # The same script the working copy uses, in its podman-less mode: the
        # order of build, binding generation and stripping is stated once.
        env:
          NATIVE: '1'
          ABIS: arm64-v8a x86_64
        run: tools/build-core.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # A pull request reads the cache master filled and writes nothing
          # back, so a branch cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Check the Gradle wrapper
        # gradle-wrapper.jar is an executable committed to the repository, and
        # distributionSha256Sum covers the distribution but not the jar that
        # downloads it.
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Decide what to build
        id: variant
        # A pull request has no access to the signing key (and should not
        # need one), so it builds the debug variant.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Kotlin sources
        # The counterpart of the fmt and clippy steps above, for the larger
        # half of the project: ktlint holds the formatting, Android Lint the
        # things a compiler has no opinion on — a deprecated API, a string
        # missing from a translation, a resource nothing uses.
        run: ./gradlew ktlintCheck lintDebug

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Keep the test reports
        continue-on-error: true
        # The step log carries the assertion and not the trace, and this is
        # the run whose report is wanted, so: always, not on success.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Decode the signing key
        if: steps.variant.outputs.name == 'release'
        # Written outside the workspace so that no later step can pick it up
        # as a build input; the runner discards RUNNER_TEMP with the machine.
        #
        # Through the environment, not the command line: an argument stands in
        # /proc/*/cmdline for anything running in this job to read, and the
        # whole signing keystore would stand there.
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build the APK
        # The signing settings reach Gradle as environment variables, which
        # app/build.gradle.kts reads; on a pull request they are unset and the
        # debug variant is built. `-Pandroid.injected.signing.*` would put the
        # passwords in the arguments of the Gradle process.
        env:
          APP_KEYSTORE_FILE: ${{ steps.variant.outputs.name == 'release' && format('{0}/keystore.jks', runner.temp) || '' }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
          TASK: ${{ steps.variant.outputs.task }}
          # The number of the run orders the builds for Android, which decides
          # what may replace what by the version code alone. It grows with
          # every run of this workflow, so a later build always outranks an
          # earlier one; a tag build is no exception, since a release is cut
          # from a commit that was built here before.
          #
          # The name is the tag when there is one, with the leading v taken
          # off, and otherwise whatever gradle.properties is at.
          VERSION_CODE: ${{ github.run_number }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          args=(-PappVersionCode="$VERSION_CODE" -PappCommit="${COMMIT:0:7}")
          if [ "$REF_TYPE" = "tag" ]; then
            args+=(-PappVersionName="${REF_NAME#v}")
          fi
          ./gradlew "$TASK" "${args[@]}"

      - name: Check the signature of the APK
        if: steps.variant.outputs.name == 'release'
        # What gets published is signed with the key held in the secrets. A
        # build that fell back to the debug key, or to none, would be
        # published all the same — the release step only checks that a file
        # is there.
        env:
          VARIANT: ${{ steps.variant.outputs.name }}
        run: |
          apksigner="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for apk in "app/build/outputs/apk/$VARIANT"/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Check what the shrinking left
        if: steps.variant.outputs.name == 'release'
        # R8 sees none of the path into the core — JNA binds it by name — so
        # what holds it is app/proguard-rules.pro, and this reads the built APK
        # back to check the rules still cover it. The instrumented tests cannot
        # do it: they run against debug, and AGP has no supported way to run
        # them against a shrunk application.
        run: tools/check-apk.sh "app/build/outputs/apk/release/app-release.apk"

      - name: Report what was built
        env:
          VARIANT: ${{ steps.variant.outputs.name }}
        run: |
          {
            echo '| APK | size |'
            echo '|-----|------|'
            for apk in "app/build/outputs/apk/$VARIANT"/*.apk; do
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ steps.variant.outputs.name }}
          path: app/build/outputs/apk/${{ steps.variant.outputs.name }}/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload the mapping of the release build
        # What turns a crash report back into names a person can read. The
        # release variant is minified, so the trace the settings screen offers
        # to copy is renamed throughout, and only the mapping of that very
        # build undoes it. Kept here for the publishing job below, which
        # attaches it to the release: a report can arrive long after an
        # artifact has expired, and the build it names is then gone.
        if: steps.variant.outputs.name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload the core
        # For the instrumented job, so that it needs neither the NDK nor a
        # Rust toolchain: the libraries and the generated Kotlin are the whole
        # of what the application takes from the core.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core
          path: |
            rust/jniLibs/**
            generated/**
          if-no-files-found: error
          retention-days: 1

  # The tests that load the native library and the tests that see a screen,
  # which are the same 40 methods the unit tests cannot reach. On a push
  # rather than on a pull request: booting an emulator and running against it
  # takes longer than everything else here put together.
  instrumented:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Around fifteen minutes, most of it the emulator coming up.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' tools/versions.env >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Download the core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      - name: Enable KVM
        # Without it the emulator falls back to software rendering of the
        # whole machine and the run takes long enough to hit the timeout.
        # This is the rule the emulator action's own documentation gives.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # The same image tools/Containerfile.emulator builds an AVD from,
          # and x86_64 is one of the two ABIs the core is built for.
          api-level: ${{ env.ANDROID_EMULATOR_API }}
          target: google_apis
          arch: x86_64
          # The same device tools/Containerfile.emulator names. Left out, the
          # action creates an AVD with no hardware profile at all, which the
          # emulator gives a 320x640 screen — narrow enough that the Material
          # date and time dialogs do not come up, and eleven tests of the
          # creation screen fail against a device nobody has.
          profile: pixel_6
          # The action's own defaults, with the cameras off as well: nothing
          # here opens one, and emulating them costs a boot.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew connectedDebugAndroidTest

      - name: Keep the test reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 3

  # Publishing is a job of its own so that the token able to write to the
  # repository never sits in the job that compiles the sources under review.
  # This one checks out the tree for the version, the changelog and the script
  # that reads a section out of it, and downloads the APK the build produced;
  # it compiles nothing.
  publish:
    # Both, so that nothing is published over a failed run of the tests that
    # exercise the native library.
    needs: [build, instrumented]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-release
          path: apk

      - name: Download the mapping
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mapping-release
          path: mapping

      # A v-tag publishes under its own name as a release, with the notes
      # written for that version in CHANGELOG.md. Anything else is a
      # prerelease of the version being worked towards, tagged
      # v<version>-build.<run> — still a version by the rules of semver, still
      # ordered below the release it leads to, and never colliding with a
      # rerun of an older commit. A rerun of the same run reuses the tag and
      # replaces the asset rather than being refused.
      - name: Publish the release
        # Every value arrives as a variable: a tag is text somebody chose, and
        # substituted into the script it would run as part of it.
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          apks=(apk/*.apk)
          version=$(sed -n 's/^appVersionName=\(.*\)$/\1/p' gradle.properties)

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            prerelease=()
          elif [ -n "$RELEASE_TAG" ]; then
            # A tag asked for by hand is a release unless the run says
            # otherwise: the input exists to publish one.
            tag="$RELEASE_TAG"
            prerelease=()
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              prerelease=(--prerelease)
            fi
          else
            tag="v${version}-build.${RUN_NUMBER}"
            prerelease=(--prerelease)
          fi

          # Named after the release it belongs to, because that is the whole
          # of its use: a trace can be read back only with the mapping of the
          # very build it came from, and an asset called mapping.txt says
          # nothing about which build that was once it has been downloaded.
          mapping="mapping/mapping-${tag}.txt"
          mv mapping/mapping.txt "$mapping"
          assets=("${apks[@]}" "$mapping")

          # The notes of a release are the lines somebody wrote about that
          # version in CHANGELOG.md. A prerelease has no section of its own,
          # so it gets the list of commits GitHub generates instead, with the
          # same two lines of metadata in front of it — which is what
          # --notes does when --generate-notes is given as well.
          metadata=$(printf '%s\n' \
            "commit: ${COMMIT}" \
            "ABIs: arm64-v8a, x86_64")

          if [ ${#prerelease[@]} -eq 0 ]; then
            {
              printf '%s\n\n' "$metadata"
              tools/release-notes.sh "${tag#v}"
            } > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--notes "$metadata" --generate-notes)
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            if [ -z "$(git ls-remote origin "refs/tags/$tag")" ]; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  tag -a "$tag" -m "$tag" "$COMMIT"
              git push origin "refs/tags/$tag"
            fi
            gh release create "$tag" \
              --title "$tag" \
              "${notes[@]}" \
              "${prerelease[@]}" \
              "${assets[@]}"
          fi
          echo "released as $tag" >> "$GITHUB_STEP_SUMMARY"
